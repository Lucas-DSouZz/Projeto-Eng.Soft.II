version: '3.3'

volumes:
  data:

services:
  db:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=aluno
      - MYSQL_DATABASE=springtutorialjpa
    volumes:
      - data:/var/lib/mysql

  app:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    links:
      - db
    ports:
      - "8080:80"